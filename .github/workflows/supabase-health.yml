name: LAES - Supabase health check

on:
  schedule:
    # 3 checks/day, away from the beginning of the hour (UTC).
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-health.yml'

# This check does not need repository access or administrative database access.
permissions: {}

concurrency:
  group: laes-supabase-health
  cancel-in-progress: false

jobs:
  database-health:
    name: Check public database
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://txwxodscfnbsgltmrfjz.supabase.co
      # Public browser key, intentionally not a service_role / secret key.
      # The same RLS policies used by anonymous visitors apply.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oweYXPxsQfXywyzsGOJBVg_-8tUjtQ7
    steps:
      - name: Read one public modality
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-max-time 70 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Accept: application/json" \
            --output "$response" \
            "$SUPABASE_URL/rest/v1/modalities?select=id&limit=1"
          # Require a real record: a 200 with an empty RLS result is not healthy.
          jq -e 'type == "array" and length == 1 and (.[0].id | type == "string")' "$response" > /dev/null
          echo "Supabase public database query succeeded."
          printf '### LAES Supabase\n\nPublic database read succeeded. No records were changed.\n' >> "$GITHUB_STEP_SUMMARY"
