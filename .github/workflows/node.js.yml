name: Validar portal LAES
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Testar fluxos de autenticação no navegador
        run: |
          PORT=3023 node .output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3023/auth -o /dev/null; then break; fi
            sleep 1
          done
          node test/browser-auth.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: laes-nitro-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
